<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ d.league.name }}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="static/style.css">
</head>
<body>

<header class="masthead">
  <div class="masthead__rule">
    <span>{{ d.league.season }} season</span>
  </div>
  <h1>{{ d.league.name }}</h1>
  <p class="standfirst">Numbers as of GW{{ gw }} &middot; updated {{ d.league.fetched_at | friendly_time }}</p>
</header>

<nav class="tabs" aria-label="Sections">
  <a href="index.html"{% if active == 'standings' %} class="active"{% endif %}>Standings</a>
  <a href="transfers.html"{% if active == 'transfers' %} class="active"{% endif %}>Transfers</a>
  <a href="releases.html"{% if active == 'releases' %} class="active"{% endif %}>Releases</a>
</nav>

<main>
{% block content %}{% endblock %}
</main>

<footer>
  <p>League {{ d.league.id }} &middot; built from the FPL Draft API &middot;
  metrics computed in <code>kpis.py</code></p>
</footer>

</body>
</html>
