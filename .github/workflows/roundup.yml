name: Build roundup

# Hourly (offset from :00 to dodge top-of-hour congestion), as a reliable
# baseline. GitHub's schedule trigger proved unreliable for this repo at
# both */2 and */15 -- real run gaps stayed at several hours regardless of
# the configured interval, so a tighter native cron doesn't help. A second,
# independent mechanism fires workflow_dispatch roughly every 30 minutes
# between these hourly runs (manual dispatches have run instantly and
# reliably every time), so day-to-day freshness comes from that, with this
# schedule as a fallback that doesn't depend on it.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      # Cloudflare blocks cloud runners often enough that this must not be
      # fatal. If the pull fails the build still runs on committed raw data.
      # A blocked request can also just hang instead of failing cleanly, so
      # cap it: continue-on-error only helps once the step actually ends.
      - name: Fetch
        id: fetch
        continue-on-error: true
        timeout-minutes: 3
        run: python fetch.py

      - name: Compute and build
        run: |
          python kpis.py
          python build.py

      # A manual trigger and the hourly schedule can land close enough
      # together that both build from the same starting commit; whichever
      # pushes second gets rejected as non-fast-forward. That's not a
      # conflict worth resolving -- the other run's push already carries
      # equally fresh data -- so just drop this run's commit and move on.
      # dist/ for the deploy step below is already built and unaffected.
      - name: Commit refreshed data
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name "roundup-bot"
          git config user.email "roundup-bot@users.noreply.github.com"
          git add data/raw data/derived
          git diff --staged --quiet || git commit -m "Refresh league data"
          git push || { git fetch origin main && git reset --hard origin/main; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
